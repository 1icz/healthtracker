{% extends 'tracker/base.html' %}

{% block content %}
<h3 class="text-center mb-4">{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} измерение</h3>
<form method="post" class="w-100">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary w-100">Сохранить</button>
    <a href="{% url 'index' %}" class="btn btn-secondary w-100 mt-2">Отмена</a>
</form>
{% endblock %}
