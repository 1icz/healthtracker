{% extends 'tracker/base.html' %}

{% block content %}
<div class="d-flex flex-column justify-content-center h-100">
    <h2 class="text-center mb-4">Вход в HealthTrack</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="alert alert-danger p-2 text-center" style="font-size: 14px;">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Имя пользователя</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-dark w-100 mt-3">Войти</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'register' %}" class="text-secondary" style="font-size: 14px;">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
